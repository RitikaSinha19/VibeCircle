# Used only by tests (@ActiveProfiles("test")). The integration tests pin the datasource themselves
# (see ApiTestBase) so they can never touch your real data: they run in the "it_test" schema.
vibecircle.media.dir=./target/test-uploads
vibecircle.auth.jwt-secret=test-only-secret-test-only-secret-test-only
vibecircle.auth.require-email-verification=false

# plain HTTP tests have no WebSocket session, so calls must not require a live connection in tests
vibecircle.calls.require-presence=false

logging.level.root=WARN
logging.level.com.vibecircle=INFO
