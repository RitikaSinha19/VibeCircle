# Activated with SPRING_PROFILES_ACTIVE=prod (the Docker image does this).
# Placeholders WITHOUT a default: the application will not start unless the environment provides them.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false

vibecircle.auth.jwt-secret=${JWT_SECRET}
vibecircle.cors.allowed-origins=${CORS_ORIGINS}
vibecircle.ws.allowed-origins=${WS_ORIGINS}
vibecircle.app.base-url=${APP_BASE_URL}
vibecircle.media.dir=${MEDIA_DIR:/data/uploads}

# running behind a reverse proxy / load balancer that terminates TLS
server.forward-headers-strategy=native

# finish in-flight requests before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

server.compression.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# health for Docker / load balancers (liveness + readiness probes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# one JSON object per log line (includes the request id), easy to ship to any log platform
logging.structured.format.console=ecs
logging.level.root=INFO
