spring.application.name=vibecircle
spring.datasource.url=jdbc:postgresql://localhost:5432/vibecircle
spring.datasource.username=vibe
spring.datasource.password=vibe_dev
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

//spring.jpa.open-in-view=false

vibecircle.auth.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
