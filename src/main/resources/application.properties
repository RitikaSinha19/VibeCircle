spring.application.name=vibecircle
spring.datasource.url=jdbc:postgresql://localhost:5432/vibecircle
spring.datasource.username=vibe
spring.datasource.password=vibe_dev
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

//spring.jpa.open-in-view=false

vibecircle.auth.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
vibecircle.auth.access-token-ttl=PT15M
vibecircle.auth.refresh-token-ttl=P30D
vibecircle.auth.min-age=18
vibecircle.auth.require-email-verification=true

vibecircle.cors.allowed-origins=http://localhost:5173

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true